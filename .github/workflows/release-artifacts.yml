name: release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    name: archive ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/llmff
            deb_arch: amd64
            arch_pkgbuild: true
          - os: macos-14
            target: aarch64-apple-darwin
            binary: target/release/llmff
            deb_arch: ""
            arch_pkgbuild: false
            macos_pkg: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/release/llmff
            deb_arch: ""
            arch_pkgbuild: false
            macos_pkg: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/llmff.exe
            deb_arch: ""
            arch_pkgbuild: false
            windows_msi: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore WiX tool
        if: ${{ matrix.windows_msi }}
        shell: bash
        run: dotnet tool restore

      - name: Build release binary
        run: cargo build --locked --release -p llmff

      - name: Smoke binary
        shell: bash
        run: |
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" stages list | grep '^infer$'
          "${{ matrix.binary }}" inspect examples/json-repair.yaml

      - name: Package archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          scripts/package-archive.sh \
            --binary "${{ matrix.binary }}" \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --out-dir dist
          archive_ext="tar.gz"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive_ext="zip"
          fi
          scripts/smoke-archive.sh --archive "dist/llmff-${version}-${{ matrix.target }}.${archive_ext}"

      - name: Package Windows MSI installer
        if: ${{ matrix.windows_msi }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          scripts/package-windows-msi.sh \
            --binary "${{ matrix.binary }}" \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --out-dir dist
          test -f "dist/llmff-${version}-${{ matrix.target }}.msi"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c "llmff-${version}-${{ matrix.target }}.msi.sha256")
          else
            (cd dist && shasum -a 256 -c "llmff-${version}-${{ matrix.target }}.msi.sha256")
          fi
          payload_root="dist/llmff-${version}-${{ matrix.target }}.msi-payload"
          mkdir -p "$payload_root"
          cp "${{ matrix.binary }}" "$payload_root/llmff.exe"
          scripts/smoke-windows-msi.sh --payload-root "$payload_root"

      - name: Package macOS installer
        if: ${{ matrix.macos_pkg }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          scripts/package-macos-pkg.sh \
            --binary "${{ matrix.binary }}" \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --out-dir dist
          test -f "dist/llmff-${version}-${{ matrix.target }}.pkg"
          (cd dist && shasum -a 256 -c "llmff-${version}-${{ matrix.target }}.pkg.sha256")
          scripts/smoke-macos-pkg.sh --pkg "dist/llmff-${version}-${{ matrix.target }}.pkg"

      - name: Package Debian installer
        if: ${{ matrix.deb_arch != '' }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          scripts/package-deb.sh \
            --binary "${{ matrix.binary }}" \
            --version "$version" \
            --arch "${{ matrix.deb_arch }}" \
            --out-dir dist
          dpkg-deb -f "dist/llmff_${version}_${{ matrix.deb_arch }}.deb" Package Version Architecture
          dpkg-deb -c "dist/llmff_${version}_${{ matrix.deb_arch }}.deb" | grep '/usr/bin/llmff$'
          (cd dist && sha256sum -c "llmff_${version}_${{ matrix.deb_arch }}.deb.sha256")
          scripts/smoke-deb.sh --deb "dist/llmff_${version}_${{ matrix.deb_arch }}.deb"

      - name: Generate Arch PKGBUILD
        if: ${{ matrix.arch_pkgbuild }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          archive="llmff-${version}-${{ matrix.target }}.tar.gz"
          archive_sha256="$(cut -d ' ' -f 1 "dist/${archive}.sha256")"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            archive_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive}"
          else
            archive_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${archive}"
          fi
          scripts/package-arch.sh \
            --version "$version" \
            --archive-url "$archive_url" \
            --archive-sha256 "$archive_sha256" \
            --out-dir dist/arch
          bash -n dist/arch/PKGBUILD
          grep -q 'pkgname=llmff-bin' dist/arch/PKGBUILD
          grep -q 'pkgname = llmff-bin' dist/arch/.SRCINFO

      - name: Upload archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llmff-${{ matrix.target }}
          path: |
            dist/*
            dist/arch/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true

  publish-release:
    name: publish release assets
    needs: archive
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ -f release-assets/arch/.SRCINFO ]]; then
            cp release-assets/arch/.SRCINFO "release-assets/llmff-${version}-arch.SRCINFO"
          elif [[ -f release-assets/.SRCINFO ]]; then
            cp release-assets/.SRCINFO "release-assets/llmff-${version}-arch.SRCINFO"
          fi
          test -f release-assets/PKGBUILD
          test -f "release-assets/llmff-${version}-arch.SRCINFO"

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi

          notes_file="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Upload GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          files=()
          for asset in release-assets/**; do
            if [[ -f "$asset" && "$(basename "$asset")" != ".SRCINFO" ]]; then
              files+=("$asset")
            fi
          done
          if [[ "${#files[@]}" -eq 0 ]]; then
            printf 'no release assets found\n' >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
