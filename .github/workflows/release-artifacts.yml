name: release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    name: archive ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/release/llmff
            deb_arch: amd64
            arch_pkgbuild: true
          - os: macos-14
            target: aarch64-apple-darwin
            binary: target/release/llmff
            deb_arch: ""
            arch_pkgbuild: false
          - os: macos-13
            target: x86_64-apple-darwin
            binary: target/release/llmff
            deb_arch: ""
            arch_pkgbuild: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/llmff.exe
            deb_arch: ""
            arch_pkgbuild: false
            windows_msi: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX
        if: ${{ matrix.windows_msi }}
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build release binary
        run: cargo build --locked --release -p llmff

      - name: Smoke binary
        shell: bash
        run: |
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" stages list | grep '^infer$'
          "${{ matrix.binary }}" inspect examples/json-repair.yaml

      - name: Package archive
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          scripts/package-archive.sh \
            --binary "${{ matrix.binary }}" \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --out-dir dist
          archive_ext="tar.gz"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive_ext="zip"
          fi
          scripts/smoke-archive.sh --archive "dist/llmff-${version}-${{ matrix.target }}.${archive_ext}"

      - name: Package Windows MSI installer
        if: ${{ matrix.windows_msi }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          scripts/package-windows-msi.sh \
            --binary "${{ matrix.binary }}" \
            --version "$version" \
            --target "${{ matrix.target }}" \
            --out-dir dist
          test -f "dist/llmff-${version}-${{ matrix.target }}.msi"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c "llmff-${version}-${{ matrix.target }}.msi.sha256")
          else
            (cd dist && shasum -a 256 -c "llmff-${version}-${{ matrix.target }}.msi.sha256")
          fi

      - name: Package Debian installer
        if: ${{ matrix.deb_arch != '' }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          scripts/package-deb.sh \
            --binary "${{ matrix.binary }}" \
            --version "$version" \
            --arch "${{ matrix.deb_arch }}" \
            --out-dir dist
          dpkg-deb -f "dist/llmff_${version}_${{ matrix.deb_arch }}.deb" Package Version Architecture
          dpkg-deb -c "dist/llmff_${version}_${{ matrix.deb_arch }}.deb" | grep '/usr/bin/llmff$'
          (cd dist && sha256sum -c "llmff_${version}_${{ matrix.deb_arch }}.deb.sha256")
          scripts/smoke-deb.sh --deb "dist/llmff_${version}_${{ matrix.deb_arch }}.deb"

      - name: Generate Arch PKGBUILD
        if: ${{ matrix.arch_pkgbuild }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo pkgid -p llmff | sed 's/.*@//')"
          fi
          archive="llmff-${version}-${{ matrix.target }}.tar.gz"
          archive_sha256="$(cut -d ' ' -f 1 "dist/${archive}.sha256")"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            archive_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${archive}"
          else
            archive_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${archive}"
          fi
          scripts/package-arch.sh \
            --version "$version" \
            --archive-url "$archive_url" \
            --archive-sha256 "$archive_sha256" \
            --out-dir dist/arch
          bash -n dist/arch/PKGBUILD
          grep -q 'pkgname=llmff-bin' dist/arch/PKGBUILD
          grep -q 'pkgname = llmff-bin' dist/arch/.SRCINFO

      - name: Upload archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llmff-${{ matrix.target }}
          path: |
            dist/*
            dist/arch/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/* dist/arch/* dist/arch/.SRCINFO)
          files=()
          for asset in "${assets[@]}"; do
            if [[ -f "$asset" ]]; then
              files+=("$asset")
            fi
          done
          if [[ "${#files[@]}" -eq 0 ]]; then
            printf 'no release assets found\n' >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
