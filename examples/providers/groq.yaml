version: 1
inputs:
  prompt:
    path: ../question.txt
graph:
  - id: load_prompt
    op: load
    input: prompt
  - id: draft
    op: infer
    from: load_prompt
    model: provider:llama-3.3-70b-versatile
    temperature: 0.2
    max_tokens: 256
    response_format: json
  - id: validate
    op: validate_json
    from: draft
    schema_path: ../answer.schema.json
outputs:
  final:
    from: validate
    path: ./groq.answer.json
