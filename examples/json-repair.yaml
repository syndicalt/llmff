version: 1
inputs:
  prompt:
    path: ./question.txt
graph:
  - id: load_prompt
    op: load
    input: prompt
  - id: render_prompt
    op: template
    from: load_prompt
    path: ./prompt.tmpl
  - id: apply_policy
    op: system
    from: render_prompt
    path: ./policy.md
  - id: draft
    op: infer
    from: apply_policy
    model: mock:bad
  - id: validate
    op: validate_json
    from: draft
    schema_path: ./answer.schema.json
  - id: repair
    op: repair
    from: validate
    when: invalid
    model: mock:good
outputs:
  final:
    from: repair
    path: ./answer.json
