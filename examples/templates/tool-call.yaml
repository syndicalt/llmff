version: 1
inputs:
  prompt:
    path: ../question.txt
graph:
  - id: load_prompt
    op: load
    input: prompt
  - id: call_tool
    op: tool
    from: load_prompt
    command:
      - /bin/cat
  - id: summarize_tool
    op: infer
    from: call_tool
    model: mock:good
    temperature: 0.2
    max_tokens: 200
outputs:
  final:
    from: summarize_tool
    path: ./tool-call.answer.txt
