version: 1
inputs:
  prompt:
    path: ../question.txt
graph:
  - id: load_prompt
    op: load
    input: prompt
  - id: summarize
    op: infer
    from: load_prompt
    model: mock:good
    temperature: 0.2
    max_tokens: 200
outputs:
  final:
    from: summarize
    path: ./summarization.answer.txt
