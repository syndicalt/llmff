version: 1
inputs:
  prompt:
    path: ../question.txt
graph:
  - id: load_prompt
    op: load
    input: prompt
  - id: classify
    op: infer
    from: load_prompt
    model: mock:good
    temperature: 0.0
    max_tokens: 128
    response_format: json
  - id: validate_classification
    op: validate_json
    from: classify
    schema: '{"type":"object","required":["label","confidence"],"properties":{"label":{"type":"string"},"confidence":{"type":"number","minimum":0,"maximum":1}},"additionalProperties":false}'
outputs:
  final:
    from: validate_classification
    path: ./classification.answer.json
