version: 1
inputs:
  prompt:
    path: ../question.txt
graph:
  - id: load_question
    op: load
    input: prompt
  - id: retrieve_context
    op: retrieve
    from: load_question
    documents:
      - ../retrieval/python.txt
      - ../retrieval/rust.txt
    strategy: lexical
    top_k: 2
  - id: rerank_context
    op: rerank
    from: retrieve_context
    strategy: lexical
    top_k: 1
  - id: answer
    op: infer
    from: rerank_context
    model: mock:good
    temperature: 0.1
    max_tokens: 384
outputs:
  final:
    from: answer
    path: ./rag-answer.txt
