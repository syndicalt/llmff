version: 1
inputs:
  task:
    path: ../question.txt
graph:
  - id: load_task
    op: load
    input: task

  - id: react_loop
    op: loop
    from: load_task
    max_iterations: 4
    break_on:
      type: field_true
      stage: task_done
      field: passed
    initial_carry:
      history: []
    carry:
      history: updated_history
    final:
      from: tool_result
      require_status: success
    body:
      - id: decide
        op: infer
        from: input
        model: mock:good
        response_format: json
        temperature: 0.2

      - id: validate_request
        op: validate_json
        from: decide
        schema: '{"type":"object","required":["tool","args","done"],"properties":{"tool":{"type":"string"},"args":{"type":"object"},"done":{"type":"boolean"},"final_answer":{"type":"string"}}}'

      - id: task_done
        op: predicate
        from: validate_request
        field: done
        mode: truthy

      - id: call_tool
        op: tool
        from: validate_request
        command: ["python3", "tool-result.py"]

      - id: tool_result
        op: validate_json
        from: call_tool
        schema: '{"type":"object","required":["ok"],"properties":{"ok":{"type":"boolean"},"result":{},"error":{"type":"string"}}}'

      - id: updated_history
        op: accumulate
        from: tool_result
        state_from: history
        mode: append
        limit: 8
outputs:
  final:
    from: react_loop
    path: ./react-style-tool-use.output.json
