version: 1
inputs:
  task:
    path: ../question.txt
graph:
  - id: load_task
    op: load
    input: task

  - id: build_initial_context
    op: template
    from: load_task
    path: ../prompt.tmpl

  - id: react_loop
    op: loop
    from: build_initial_context
    max_iterations: 4
    break_on:
      type: field_true
      stage: task_done
      field: passed
    initial_carry:
      history: []
    carry:
      history: updated_history
    final:
      from: final_answer
      require_status: success
    body:
      - id: reason
        op: infer
        from: input
        model: mock:good
        response_format: json
        temperature: 0.2

      - id: parse_action
        op: validate_json
        from: reason
        schema: '{"type":"object","required":["tool","args","done"],"properties":{"tool":{"type":"string"},"args":{"type":"object"},"done":{"type":"boolean"},"final_answer":{"type":"string"}}}'

      - id: task_done
        op: predicate
        from: parse_action
        field: done
        mode: truthy

      - id: execute_tool
        op: tool
        from: parse_action
        command: ["python3", "tool-result.py"]

      - id: observe
        op: validate_json
        from: execute_tool
        schema: '{"type":"object","required":["ok"],"properties":{"ok":{"type":"boolean"},"result":{},"error":{"type":"string"}}}'

      - id: updated_history
        op: accumulate
        from: observe
        state_from: history
        mode: append
        limit: 8

      - id: final_answer
        op: extract
        from: parse_action
        field: final_answer
outputs:
  final:
    from: react_loop
    path: ./react-style-tool-use.output.json
