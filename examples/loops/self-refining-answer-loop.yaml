version: 1
inputs:
  question:
    path: ../question.txt
graph:
  - id: load_question
    op: load
    input: question

  - id: refine_loop
    op: loop
    from: load_question
    max_iterations: 3
    break_on:
      type: field_true
      stage: quality_ready
      field: passed
    final:
      from: final_answer
      require_status: success
    body:
      - id: draft
        op: infer
        from: input
        model: mock:good
        response_format: json
        temperature: 0.2

      - id: quality_check
        op: validate_json
        from: draft
        schema: '{"type":"object","required":["answer","confidence"],"properties":{"answer":{"type":"string"},"confidence":{"type":"number","minimum":0,"maximum":1}}}'

      - id: quality_ready
        op: predicate
        from: quality_check
        field: confidence
        mode: gte
        value: 0.8

      - id: final_answer
        op: extract
        from: quality_check
        field: answer
outputs:
  final:
    from: refine_loop
    path: ./self-refining-answer.output.json
