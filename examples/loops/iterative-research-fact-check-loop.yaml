version: 1
inputs:
  question:
    path: ../question.txt
graph:
  - id: load_question
    op: load
    input: question

  - id: build_research_prompt
    op: template
    from: load_question
    path: ../prompt.tmpl

  - id: research_loop
    op: loop
    from: build_research_prompt
    max_iterations: 5
    break_on:
      type: field_true
      stage: supported
      field: passed
    initial_carry:
      claim_history: []
    carry:
      claim_history: updated_claim_history
    final:
      from: updated_claim_history
      require_status: success
    body:
      - id: retrieve_context
        op: retrieve
        from: input
        documents:
          - ../retrieval/python.txt
          - ../retrieval/rust.txt
        strategy: lexical
        top_k: 2

      - id: synthesize
        op: infer
        from: retrieve_context
        model: mock:good
        response_format: json
        temperature: 0.2

      - id: fact_check
        op: validate_json
        from: synthesize
        schema: '{"type":"object","required":["supported","claims","sources"],"properties":{"supported":{"type":"boolean"},"claims":{"type":"array","items":{"type":"string"}},"sources":{"type":"array","items":{"type":"string"}}}}'

      - id: supported
        op: predicate
        from: fact_check
        field: supported
        mode: truthy

      - id: claims
        op: extract
        from: fact_check
        field: claims

      - id: updated_claim_history
        op: accumulate
        from: claims
        state_from: claim_history
        mode: extend
        limit: 6
outputs:
  final:
    from: research_loop
    path: ./iterative-research-fact-check.output.json
