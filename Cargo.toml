[workspace]
members = [
    "crates/llmff-core",
    "crates/llmff-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/syndicalt/llmff"
version = "0.1.3"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
async-trait = "0.1"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
jsonschema = "0.17"
libc = "0.2"
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
wiremock = "0.6"
